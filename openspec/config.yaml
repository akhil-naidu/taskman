schema: spec-driven

context: |
  taskman is a Next.js App Router, TypeScript, and Convex app, installed with pnpm, meant to run on Railway later.
  It gives a fleet of assistant bots a board: fleet visibility, box hygiene, task ownership and org boundaries, then read-only sync with ClickUp, GitHub Issues, Linear, and Jira.
  The box stays the source of truth. The hosted app never reads it. A push script upserts a snapshot.
  Board times are IST.
  Draft pull requests only. Never merge, mark ready for review, push to master, or deploy.
  No Railway deploys, no production Convex deploy, and no Railway or Convex setting changes.
  No paid API calls.
  No real bot names, fleet data, or secrets in the repo, fixtures, commits, or pull request text.
  Fixtures use bot-a and bot-b. Pull request text is neutral and has no attribution lines.
  Read openspec/project.md before a change. New behavior needs proposal.md, tasks.md, and spec deltas before feature code.

rules:
  proposal:
    - State what is out of scope
    - Do not include real bot names, fleet data, secrets, or attribution
  specs:
    - Use SHALL or MUST, and give each requirement at least one scenario
    - Describe observable behavior
  tasks:
    - Use numbered checkboxes
    - Include how to verify the task
